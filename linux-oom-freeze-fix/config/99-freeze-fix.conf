# /etc/sysctl.d/99-freeze-fix.conf
# Voi zram, nen "swap" sang RAM nen som thay vi xoa trang ma giao dien
vm.swappiness = 180
# zram truy cap ngau nhien -> tat read-ahead khi swap-in
vm.page-cluster = 0
# Phan ung som hon voi suc ep bo nho, giam dot bien gay treo
vm.watermark_scale_factor = 125
vm.watermark_boost_factor = 0
